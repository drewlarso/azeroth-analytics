name: Sync Auctions to R2

on:
    schedule:
        - cron: '20 * * * *'
    workflow_dispatch:

jobs:
    fetch-auctions:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Run fetch_auctions.py
              run: make fetch-auctions
              env:
                  BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
                  BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
                  BNET_REGION: ${{ vars.BNET_REGION }}
                  BNET_LOCALE: ${{ vars.BNET_LOCALE }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
                  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
